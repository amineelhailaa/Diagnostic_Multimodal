services:
  jupyter:
    build:
      context: .
      dockerfile: docker/Dockerfile.jupyter
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
      - ./Data:/workspace/Data
    working_dir: /workspace

  streamlit:
    build:
      context: .
      dockerfile: docker/Dockerfile.streamlit
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      BRAINSCAN_MODEL_PATH: /workspace/checkpoints/best_model.keras
    volumes:
      - ./Data:/workspace/Data:ro
      - ./models:/workspace/models:ro
      - ./notebooks/checkpoints:/workspace/checkpoints:ro
    init: true